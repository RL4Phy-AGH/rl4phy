volumes:
  geant_build:

services:
  stubs-generator:
    image: rl4phy-geant:latest
    entrypoint: sh
    command:
      - -c
      - |
        mkdir -p .stubs/cpp_generated .stubs/.sysroot/usr .stubs/python

        protoc --proto_path=proto --cpp_out=.stubs/cpp_generated --grpc_out=.stubs/cpp_generated --plugin=protoc-gen-grpc=/usr/bin/grpc_cpp_plugin proto/rl4phy.proto

        rm -rf .stubs/.sysroot/usr/include .stubs/.sysroot/opt
        cp -r /usr/include .stubs/.sysroot/usr/include
        cp -r /opt .stubs/.sysroot/opt

        chmod -R 755 .stubs || true
    volumes:
      - .:/workspace
    working_dir: /workspace

  python:
    volumes:
      - ./python:/app/python
      - ./.stubs/python:/app/generated
    environment:
      PYTHONPATH: /app/python:/app/generated
    command: >
      sh -c "mkdir -p /app/generated/site-packages &&
      cp -au /usr/local/lib/python3.11/site-packages/. /app/generated/site-packages/ &&
      python /app/python/flatten_sys_path.py /app/generated/site-packages &&
      python -m grpc_tools.protoc 
      -I/app/proto 
      --python_out=/app/generated 
      --mypy_out=/app/generated 
      --mypy_grpc_out=/app/generated 
      --grpc_python_out=/app/generated 
      /app/proto/rl4phy.proto && 
      chmod -R 755 /app/generated || true &&
      python server.py"
    depends_on:
      stubs-generator:
        condition: service_completed_successfully

  geant:
    depends_on:
      stubs-generator:
        condition: service_completed_successfully
    volumes:
      - ./geant4:/app/geant4
      - ./proto:/app/proto
      - geant_build:/app/geant4/MUonE/build
    entrypoint: sh
    command:
      - -c
      - |
        cmake -S /app/geant4/MUonE -B /app/geant4/MUonE/build -DGeant4_DIR=/opt/geant4/lib/cmake/Geant4 -DCMAKE_BUILD_TYPE=Release
        cmake --build /app/geant4/MUonE/build --config Release --parallel $$(nproc)
        rm -f "$$GDML_EXPORT_PATH"
        exec /app/geant4/MUonE/build/rl4phy-geant --export-gdml "$$GDML_EXPORT_PATH" --grpc-host python:50051 macros/run.mac
