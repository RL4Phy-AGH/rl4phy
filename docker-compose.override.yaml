services:
  stubs-generator:
    image: rl4phy-geant:latest
    entrypoint: sh
    command:
      - -c
      - |
        mkdir -p .stubs/cpp_generated .stubs/.sysroot .stubs/python
        
        protoc --proto_path=proto --cpp_out=.stubs/cpp_generated --grpc_out=.stubs/cpp_generated --plugin=protoc-gen-grpc=/usr/bin/grpc_cpp_plugin proto/rl4phy.proto
        
        # Mirror the whole /usr/include and /opt trees rather than an allowlist
        # of packages: any future apt -dev package or Geant4 module shows up
        # for clangd automatically, with no changes needed here. /usr/include
        # is ~45MB and /opt is ~200MB (mostly Geant4), so a full copy is cheap;
        # /usr/lib and /usr/bin are skipped since clangd only needs headers.
        mkdir -p .stubs/.sysroot/usr
        [ ! -d .stubs/.sysroot/usr/include ] && cp -r /usr/include .stubs/.sysroot/usr/include || true
        [ ! -d .stubs/.sysroot/opt ] && cp -r /opt .stubs/.sysroot/opt || true
        
        chmod -R 777 .stubs || true
    volumes:
      - .:/workspace
    working_dir: /workspace

  python:
    volumes:
      - ./python:/app/python
      - ./.stubs/python:/app/generated
    environment:
      - PYTHONPATH=/app/python:/app/generated
    command: >
      sh -c "cp -rn /usr/local/lib/python3.11/site-packages /app/generated/ || true &&
      python /app/python/flatten_sys_path.py /app/generated/site-packages &&
      python -m grpc_tools.protoc 
      -I/app/proto 
      --python_out=/app/generated 
      --mypy_out=/app/generated 
      --mypy_grpc_out=/app/generated 
      --grpc_python_out=/app/generated 
      /app/proto/rl4phy.proto && 
      chmod -R 777 /app/generated || true &&
      python server.py"
    depends_on:
      stubs-generator:
        condition: service_completed_successfully

  geant:
    depends_on:
      stubs-generator:
        condition: service_completed_successfully
    volumes:
      - ./geant4:/app/geant4
      - ./proto:/app/proto
    entrypoint: sh
    command:
      - -c
      - |
        cmake -S /app/geant4/MUonE -B /app/geant4/MUonE/build -DGeant4_DIR=/opt/geant4/lib/cmake/Geant4 -DCMAKE_BUILD_TYPE=Release
        cmake --build /app/geant4/MUonE/build --config Release --parallel $$(nproc)
        exec /app/geant4/MUonE/build/rl4phy-geant --grpc-host python:50051 macros/run.mac
