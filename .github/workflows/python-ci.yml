name: python-ci

on:
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # ruff comes from the dev group, so CI and a developer run the same
      # version rather than whatever is newest that day.
      - name: Install dependencies
        run: uv sync --locked --only-group dev

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check --output-format=github .
