x-gdml-export-path: &gdml_export_path /export/muone.gdml

services:
  g4data:
    image: alpine:3.20
    volumes:
      - g4data:/data
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -f /data/.ready ]; then echo "datasets already present"; exit 0; fi
        cd /data
        base=https://geant4-data.web.cern.ch/geant4-data/datasets
        for t in G4ENSDFSTATE.3.0 G4EMLOW.8.8 G4PARTICLEXS.4.2 G4PhotonEvaporation.6.1.2; do
          echo "downloading $$t"
          wget -qO- "$$base/$$t.tar.gz" | tar xz
        done
        touch /data/.ready
        echo "datasets ready"

  python:
    build:
      context: .
      dockerfile: python/Dockerfile
    ports:
      - "50051:50051"
      - "9876:9876" # rerun --connect rerun+http://127.0.0.1:9876/proxy
    environment:
      GDML_EXPORT_PATH: *gdml_export_path
    volumes:
      - gdml_export:/export:ro

  geant:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      g4data:
        condition: service_completed_successfully
      python:
        condition: service_started
    environment:
      GDML_EXPORT_PATH: *gdml_export_path
    volumes:
      - g4data:/data:ro
      - gdml_export:/export

volumes:
  g4data:
  gdml_export:
