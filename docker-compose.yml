services:
  # One-shot: fetch the Geant4 datasets into the g4data volume before geant runs.
  # Versions match the G4*DATA paths baked into the geant image. G4NDL is left out
  # since FTFP_BERT does not use the high-precision neutron data. The .ready marker
  # keeps a second `up` from downloading everything again.
  g4data:
    image: alpine:3.20
    volumes:
      - g4data:/data
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -f /data/.ready ]; then echo "datasets already present"; exit 0; fi
        cd /data
        base=https://geant4-data.web.cern.ch/geant4-data/datasets
        for t in G4ENSDFSTATE.3.0 G4EMLOW.8.8 G4PARTICLEXS.4.2 G4PhotonEvaporation.6.1.2; do
          echo "downloading $$t"
          wget -qO- "$$base/$$t.tar.gz" | tar xz
        done
        touch /data/.ready
        echo "datasets ready"

  python:
    build:
      context: .
      dockerfile: python/Dockerfile
    ports:
      - "50051:50051"
      - "9876:9876" # rerun --connect rerun+http://127.0.0.1:9876/proxy
    volumes:
      - gdml_export:/export:ro

  geant:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      g4data:
        condition: service_completed_successfully
      python:
        condition: service_started
    volumes:
      - g4data:/data:ro
      - gdml_export:/export

volumes:
  g4data:
  # Geant4 writes muone.gdml here (--export-gdml) right after building the
  # detector; python reads it back to draw the real station geometry instead
  # of a hardcoded copy. See python/gdml_geometry.py.
  gdml_export:
