syntax = "proto3";

package rl4phys;

// B1: energy deposit per event
message EventScoring
{
    float edep = 1;
    int32 event_id = 2;
}

// Total energy and momentum of one particle, MeV. Named after G4LorentzVector,
// which is what the Geant4 side reads it from.
message LorentzVector
{
    double e = 1;
    double px = 2;
    double py = 3;
    double pz = 4;
}

// One particle crossing one layer: the four-momentum where it entered and
// where it left, so energy loss and scattering angle come from one message
// and nothing has to be paired on the receiving side. entry.e - exit.e is
// the energy the particle lost, including what its secondaries carried away;
// it is not the energy deposited in the layer. Primaries only for now; a
// particle that stops inside the layer sends nothing.
message StepHit
{
    // Fields 1 to 7 are the old per-step point. Nothing sends them, but
    // commons/GrpcClient.hh still compiles against them, so they stay until the
    // Geant4 side switches to the fields below.
    float x = 1;
    float y = 2;
    float z = 3;
    float px = 4;
    float py = 5;
    float pz = 6;
    float e_kin = 7;
    int32 track_id = 8;
    // Not a unique key: it restarts at 0 on every /run/beamOn.
    int32 event_id = 9;
    int32 parent_id = 10;
    int32 pdg = 11;
    string volume = 12;  // physical volume name, as in the GDML
    LorentzVector entry = 13;
    LorentzVector exit = 14;
    // mm, summed over the steps inside the layer: longer than the thickness
    // for a slanted or scattered track.
    float path_length = 15;
}

// Every crossing of one event, sent once its stepping is over: the same hook
// and the same stream as EventTrajectories, one message per event.
message EventStepHits
{
    // Same warning as StepHit.event_id: it restarts at 0 on every /run/beamOn.
    int32 event_id = 1;
    repeated StepHit hits = 2;
}

// B5: double arm spectrometer, one event summarised after all hits are collected
message B5Event
{
    // Not a unique key: it restarts at 0 on every /run/beamOn and multithreaded
    // runs deliver events out of order.
    int32 event_id = 1;
    // Two values per arm-indexed field: chamber 1/2, hodoscope 1/2. An arm the
    // particle missed reports 0 hits and a hodoscope time of -1.
    repeated int32 drift_chamber_hits = 2;
    repeated float hodoscope_time = 3;  // time of the first hit, ns
    // Every cell of every event, MeV, empty ones included: 80 EM cells
    // (kNofEmCells), 20 hadronic (kNofHadCells). Both index as
    // column * rows + row, so they reshape to (20, 4) and (10, 2).
    repeated float em_cal_edep = 4;
    repeated float had_cal_edep = 5;
}

// One tracked particle, as Geant4's own viewer draws it: the polyline it left
// behind plus the identity that decides its colour. Built from G4Trajectory, so
// what arrives here is the same object /vis/scene/add/trajectories renders.
message Trajectory
{
    int32 track_id = 1;
    int32 parent_id = 2;  // 0 for a primary; otherwise the track that made this one
    int32 pdg = 3;
    float charge = 4;             // in units of e, so drawByCharge is reproducible
    string particle_name = 5;     // Geant4's own name, e.g. "e-", "gamma", "anti_nu_mu"
    // Point coordinates in mm, flattened as x,y,z triples: the length is always
    // a multiple of 3. Flat rather than a repeated message because a shower
    // event carries hundreds of thousands of these and proto3 packs scalars.
    repeated float points = 6;
    float initial_e_kin = 7;  // kinetic energy at the start of the track, MeV
}

// Every trajectory of one event, sent once its stepping is over. One message
// per event rather than one per step: this is what the viewer draws, and a
// trajectory is only meaningful whole.
message EventTrajectories
{
    // Same warning as B5Event.event_id: not a unique key, it restarts at 0 on
    // every /run/beamOn, so the receiver has to number events itself.
    int32 event_id = 1;
    repeated Trajectory trajectories = 2;
}

//Oneof types defined in payload
message Data
{
    oneof payload
    {
        EventScoring event_scoring = 1;
        StepHit step_hit = 2;
        EventStepHits event_step_hits = 6;
        B5Event b5_event = 3;
        EventTrajectories event_trajectories = 4;
    }
}

message Reply {}

// Geometry hand-off (issue #18): the exported GDML, sent at the start of every
// /run/beamOn and before that run's event data. Once per run rather than once
// per job because a UI command can move the detector between runs, as B5's
// /B5/detector/armAngle does three times over B5/run1.mac; a single hand-off
// would leave most of a run's events drawn on a detector they never saw.
message GeometryFile
{
    bytes gdml = 1;
}

service SendService
{
    // Client opens one stream, many Data writes with one Reply.
    rpc SendDataStream (stream Data) returns (Reply) {}
    rpc SendGeometry (GeometryFile) returns (Reply) {}
}
