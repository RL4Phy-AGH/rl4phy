syntax = "proto3";

package rl4phys;

// B1: energy deposit per event
message EventScoring
{
    float edep = 1;
    int32 event_id = 2;
}

// MUonE: one step inside a station volume
message StepHit
{
    float x = 1;
    float y = 2;
    float z = 3;
    float px = 4;
    float py = 5;
    float pz = 6;
    float e_kin = 7;
    int32 track_id = 8;
    int32 event_id = 9;
    int32 parent_id = 10;
    int32 pdg = 11;
}

// B5: double arm spectrometer, one event summarised after all hits are collected
message B5Event
{
    // Not a unique key: it restarts at 0 on every /run/beamOn and multithreaded
    // runs deliver events out of order.
    int32 event_id = 1;
    // Two values per arm-indexed field: chamber 1/2, hodoscope 1/2. An arm the
    // particle missed reports 0 hits and a hodoscope time of -1.
    repeated int32 drift_chamber_hits = 2;
    repeated float hodoscope_time = 3;  // time of the first hit, ns
    // Every cell of every event, MeV, empty ones included: 80 EM cells
    // (kNofEmCells), 20 hadronic (kNofHadCells). Both index as
    // column * rows + row, so they reshape to (20, 4) and (10, 2).
    repeated float em_cal_edep = 4;
    repeated float had_cal_edep = 5;
}

//Oneof types defined in payload
message Data
{
    oneof payload
    {
        EventScoring event_scoring = 1;
        StepHit step_hit = 2;
        B5Event b5_event = 3;
    }
}

message Reply {}

// One-off geometry hand-off (issue #18): the exported GDML is sent once at
// startup, before any step data.
message GeometryFile
{
    bytes gdml = 1;
}

service SendService
{
    rpc SendData (Data) returns (Reply) {}
    rpc SendGeometry (GeometryFile) returns (Reply) {}
}
